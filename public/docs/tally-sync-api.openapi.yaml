      operationId: requestSalesVoucherPdfByNumber
      description: >-
        Connector searches Tally by company, party ledger and voucher number without a prior import request.
        Poll the same URL after 202. Zero or multiple Tally matches fail the export (424); supply voucher_date
        to disambiguate. Cached PDFs and temporary jobs have independent retention. Deleted cache is
        recreated. Ready cached PDFs remain downloadable with valid client authentication while
        Connector/Tally are offline. New/uncached exports require Connector and Tally. Use retry=true after
        fixing a failed export. Default PDF retention is 90 days; request-ID PDFs expire no later than the
        source request.
      security:
        - clientId: []
