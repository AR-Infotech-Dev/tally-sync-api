openapi: 3.0.3
info:
  title: Flowups Tally Sync API
  version: 1.0.0
  description: >-
    REST API for onboarding CRM clients, importing Sales Orders, Sales Vouchers, Receipts, Purchase Orders,
    Purchases and Payments, reading vouchers and cached ledger statements, and downloading PDFs. Voucher
    pushes queue work internally but wait for a final Connector result: HTTP 200 succeeds, 502 rejects, and
    504 returns request_id when the wait expires. Only pending Sales PDF exports use HTTP 202 polling.
    Application authentication uses X-Client-ID plus X-API-Key; Connector-only calls use X-Client-ID plus
    X-Connector-Key. JSON result properties appear at the top level unless explicitly documented as
    data/statement. Examples use fictional placeholders and require matching Tally masters.
servers:
  - url: http://localhost:3000
    description: Local Server
  - url: https://sync.flowups.in
    description: Production Server
tags:
  - name: Health
  - name: Client Registration
  - name: Sales Orders
  - name: Sales Vouchers
  - name: Receipt Vouchers
  - name: Purchase Orders
  - name: Purchase Vouchers
  - name: Payment Vouchers
  - name: Companies
  - name: Ledger Statements
  - name: Admin Console
    description: Administrative session endpoints, separate from CRM API keys.
paths:
  /api/v1/clients/activate-connector:
    post:
      tags:
        - Client Registration
      summary: Exchange a one-time emailed activation code for Connector credentials
      operationId: activateConnector
      security: []
      description: >-
        Code expires 24 hours after registration and is consumed atomically once. Returns Connector
        credentials only; never returns the application API key. Use HTTPS remotely. On failure or a lost
        response, use manual Connector credentials from the registration email. Limited to 10 attempts per 15
        minutes. Existing application authentication remains X-Client-ID plus X-API-Key; the API key is the
        secret and no separate API Secret is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - activation_code
              properties:
                activation_code:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
            example:
              activation_code: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        '200':
          description: Connector credentials; response has Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: integer
                  type:
                    type: string
                  message:
                    type: string
                  client_id:
                    type: string
                  connector_id:
                    type: string
                  connector_key:
                    type: string
                    description: Secret for Connector use only
              example:
                success: true
                code: 1000
                type: OK
                message: Connector activated. Continue with Tally setup.
                client_id: CLIENT_DEMO0000000001
                connector_id: CONNECTOR_DEMO0000000001
                connector_key: YOUR_CONNECTOR_KEY
        '400':
          description: Missing or malformed activation code.
        '401':
          description: Invalid, expired or previously used activation code.
        '429':
          description: Too many activation attempts.
      x-audience: public
  /api/v1/companies:
    get:
      tags:
        - Companies
      summary: List companies available to the authenticated client
      operationId: listCompanies
      security:
        - clientId: []
          clientApiKey: []
      description: >-
        Returns stable system company_id values for companies present in the Connector local SQLite snapshot.
        Use destination.company_id on data push requests. A company is active only after its local snapshot is
        ready; inactive companies are returned for visibility but must not receive new work.
      responses:
        '200':
          description: Company list retrieved from Connector cache.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: OK
                message: Companies retrieved from the Connector cache.
                companies:
                  - company_id: COMP_01JABC123
                    company_name: Demo Company
                    tally_guid: 646d1f1a-2756-424a-bc49-000000000001
                    status: active
                    last_synced_at: '2026-10-30T08:00:00.000Z'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '503':
          $ref: '#/components/responses/ConnectorUnavailable'
      x-audience: application
  /api/v1/ledgers/statement/pdf:
    post:
      tags:
        - Ledger Statements
      summary: Generate a PDF ledger statement from the local synced snapshot
      operationId: getLedgerStatementPdf
      security:
        - clientId: []
          clientApiKey: []
      description: >-
        Uses the same company, dealer_code/ledger_name, from_date and to_date body as the JSON statement endpoint. Dealer code takes priority; ledger_name is the fallback. Returns
        a downloadable PDF with repeated headers, period balances, transactions and freshness metadata. No
        extra Tally export occurs. Use is_detailed: "no" (default) for condensed voucher rows or "yes" for
        item quantity/rate/amount and bill-reference breakup from the synced cache. Errors remain JSON. PDF
        bytes are generated in memory and are not persisted. Rendered by the API from cached data; this is not
        a native Tally PDF export. report_format overrides is_detailed; individual show flags override format
        defaults. Voucher numbers default to yes. Narrations, bills and inventory follow selected format;
        payment mode, bank details and stripes default to no. Missing cache details are indicated explicitly.
        Requires responsive Connector; Tally may be offline after initial sync.
      requestBody:
        $ref: '#/paths/~1api~1v1~1ledgers~1statement/post/requestBody'
      responses:
        '200':
          description: Ledger statement PDF ready for preview or saving.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="statement-Anjan_Ambare-2026-10-01-2026-10-31.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          description: Ledger or statement job not found.
        '503':
          description: >-
            Connector offline/unresponsive, or initial local cache sync is incomplete. Tally need not be
            running after a usable cache exists.
        '504':
          description: Connector response timed out.
      x-audience: application
  /api/v1/ledgers/statement:
    post:
      tags:
        - Ledger Statements
      summary: Read a normalized ledger statement from the Connector SQLite cache
      operationId: getLedgerStatement
      parameters:
        - name: format
          in: query
          description: Set pdf for PDF bytes; omit for the existing JSON response.
          schema:
            type: string
            enum:
              - json
              - pdf
      description: >-
        Date range is inclusive. Company defaults to Connector settings if omitted. Returns normalized
        base-currency entries, debit/credit totals, opening and closing balances. Opening includes posted
        movements before from_date. Connector performs initial and three-minute background Tally syncs. This
        API never queries Tally directly. Requires a running Connector and a completed local snapshot; returns
        503 while the cache is uninitialized. Tally can be offline after initial sync; stale data is
        explicitly marked. Uses the existing asynchronous job flow while the HTTP request waits. Default
        Connector job wait is 15 seconds; PDF rendering is outside that budget. Dates must be real YYYY-MM-DD
        dates from 1900-01-01 through 2099-12-31, with to_date on or after from_date. Connector must remain
        responsive even when Tally is offline.
      security:
        - clientId: []
          clientApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_date
                - to_date
              properties:
                company:
                  type: string
                dealer_code:
                  type: string
                  description: Exact Dealer Code from the Tally ledger UDF. Takes priority over ledger_name.
                ledger_name:
                  type: string
                  description: Exact ledger name fallback when dealer_code is omitted.
                from_date:
                  type: string
                  format: date
                to_date:
                  type: string
                  format: date
                report_format:
                  type: string
                  enum:
                    - condensed
                    - detailed
                  description: Overrides is_detailed format; individual show flags override format defaults.
                show_narrations:
                  type: string
                  enum:
                    - 'yes'
                    - 'no'
                show_voucher_no:
                  type: string
                  enum:
                    - 'yes'
                    - 'no'
                show_bill_wise_details:
                  type: string
                  enum:
                    - 'yes'
                    - 'no'
                show_inventory_details:
                  type: string
                  enum:
                    - 'yes'
                    - 'no'
                show_payment_receipt_mode:
                  type: string
                  enum:
                    - 'yes'
                    - 'no'
                show_bank_details:
                  type: string
                  enum:
                    - 'yes'
                    - 'no'
                enable_stripe_view:
                  type: string
                  enum:
                    - 'yes'
                    - 'no'
                is_detailed:
                  type: string
                  enum:
                    - 'yes'
                    - 'no'
                  default: 'no'
                  description: >-
                    PDF presentation only. Detailed includes cached inventory and bill allocations; condensed
                    keeps voucher rows.
            example:
              company: Demo Company
              ledger_name: Demo Customer
              from_date: '2026-10-01'
              to_date: '2026-10-31'
              report_format: detailed
              show_voucher_no: 'yes'
              show_narrations: 'yes'
      responses:
        '200':
          description: Normalized statement; no activity returns an empty entries array.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              example:
                success: true
                code: 1000
                type: OK
                message: Ledger statement retrieved from local synced database.
                data:
                  company: Demo Company
                  ledger_name: Demo Customer
                  from_date: '2026-10-01'
                  to_date: '2026-10-31'
                  opening_balance:
                    amount: 0
                    type: null
                  entries:
                    - date: '2026-10-31'
                      voucher_no: '44'
                      voucher_type: Sales New
                      master_id: '123'
                      narration: ''
                      particulars:
                        - Sales
                      debit: 250
                      credit: 0
                      balance:
                        amount: 250
                        type: Dr
                  total_debit: 250
                  total_credit: 0
                  closing_balance:
                    amount: 250
                    type: Dr
                  source: local_sqlite
                  last_synced_at: '2026-10-23T10:00:00.000Z'
                  sync_status: ready
                  is_stale: false
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: integer
                  type:
                    type: string
                    description: HTTP status label such as OK, CREATED, BAD_REQUEST or GATEWAY_TIMEOUT.
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/LedgerStatement'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          description: Ledger not found in the selected company.
        '502':
          description: Connector or local statement read failed.
        '503':
          description: >-
            Connector is offline/unresponsive, or the local cache has not completed initial sync. error_code
            is present for Connector availability failures.
        '504':
          description: Connector response timed out; request_id can be used at the status endpoint.
      x-audience: application
  /api/v1/ledgers/{requestId}/status:
    get:
      tags:
        - Ledger Statements
      operationId: getLedgerStatementStatus
      summary: Read a ledger statement job status and completed result
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Stored ledger job status/result.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: OK
                message: Success
                request_id: 18771bcc-5374-4c11-8e43-0b930659de08
                status: succeeded
                statement:
                  company: Demo Company
                  ledger_name: Demo Customer
                  from_date: '2026-10-01'
                  to_date: '2026-10-31'
                  opening_balance:
                    amount: 0
                    type: null
                  entries: []
                  total_debit: 0
                  total_credit: 0
                  closing_balance:
                    amount: 0
                    type: null
                  source: local_sqlite
                  last_synced_at: '2026-10-28T08:00:00.000Z'
                  sync_status: ready
                  is_stale: false
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      description: >-
        Reads the saved ledger job without contacting Tally. Successful result is in statement; failed result
        can contain error. Works while Connector/Tally are offline.
      x-audience: application
  /health:
    get:
      tags:
        - Health
      summary: Check Server health
      operationId: getHealth
      responses:
        '200':
          description: Server is running.
          content:
            application/json:
              example:
                status: ok
                app: Flowups - Tally Sync API
                legacyRoot: /
                migratedControllers:
                  - login
      security: []
      x-audience: public
  /api/v1/clients/register:
    post:
      tags:
        - Client Registration
      summary: Register a CRM client and Tally Connector
      operationId: registerClient
      description: >-
        Registers a client using its Tally license number. The API key and Connector credentials are emailed
        to the submitted address; they are not returned in the response. Registration is rate-limited to five
        requests per hour per source. JSON returns no API/Connector keys. Keys are emailed. Tally license
        numbers must be unique. Application API key is the application secret; no additional API Secret is
        required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistration'
            example:
              name: Demo User
              company_name: Demo Company
              email: developer@example.com
              tally_license_no: DEMO-LICENSE-001
      responses:
        '201':
          description: Client registered; credentials emailed.
          content:
            application/json:
              example:
                success: true
                code: 1001
                type: CREATED
                message: Client registered. Credentials were sent to the registered email address.
                client_id: CLIENT_DEMO0000000001
                connector_id: CONNECTOR_DEMO0000000001
                email: developer@example.com
                credentials_emailed: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Tally license number is already registered.
          content:
            application/json:
              example:
                success: false
                code: 2000
                type: CONFLICT
                message: This Tally license number is already registered.
        '429':
          description: 'Registration rate limit exceeded: 5 attempts per hour for the source/email bucket.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
      x-audience: public
  /api/v1/sales-orders/push:
    post:
      tags:
        - Sales Orders
      summary: Create a Sales Order in Tally and wait for the result
      operationId: pushSalesOrder
      description: >-
        The Server queues the job and keeps this HTTP request open for the final Connector/Tally result
        (default 120 seconds). HTTP 200 confirms succeeded; HTTP 502 means Tally rejected it; HTTP 504 returns
        request_id when the wait expires, and the stored job may still finish. Read saved status before
        retrying. New imports require a responsive Connector and running Tally. Reuse idempotency_key only for
        the same transaction/payload. A completed duplicate returns duplicate: true. The company configured in
        Connector settings takes precedence over destination.company. Every order item requires order_due_date
        on the item or inherited from the order.
      security:
        - clientId: []
          clientApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderPush'
            example:
              idempotency_key: CRM-SALES_ORDER-1001
              destination:
                company: Demo Company
              sales_order:
                voucher_type: Sales Order
                voucher_number: SO-1001
                order_number: SO-1001
                date: '2026-10-28'
                order_due_date: '2026-11-04'
                party:
                  ledger_name: Demo Customer
                items:
                  - stock_item: Demo Item
                    quantity: 2
                    unit: Nos
                    rate: 100
                    sales_ledger: Sales
      responses:
        '200':
          description: Sales Order accepted by Tally, including an already-completed duplicate.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: OK
                message: Tally accepted the Sales Order.
                request_id: 18771bcc-5374-4c11-8e43-0b930659de08
                status: succeeded
                duplicate: false
                transaction_type: sales_order
                voucher_number: SO-1001
                submitted_voucher_number: SO-1001
                tally_result:
                  voucher_number: SO-1001
                  voucher_number_source: tally
              schema:
                $ref: '#/components/schemas/PushResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/TallyRejected'
        '503':
          description: >-
            Connector/Tally unavailable. error_code identifies CONNECTOR_NOT_CONNECTED,
            CONNECTOR_NOT_RESPONDING or TALLY_NOT_CONNECTED. No new job is queued after failed preflight;
            request_id is present if a disconnection occurred after acceptance.
          content:
            application/json:
              example:
                success: false
                code: 2013
                type: SERVICE_UNAVAILABLE
                message: Connector is not connected. Start the Connector and connect it to the Server.
                error_code: CONNECTOR_NOT_CONNECTED
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: >-
            Connector has not completed the job within the configured wait. Work may still finish; read status
            using request_id before retrying. Preflight failures instead return code 2015 with error_code
            TALLY_TIMEOUT or CONNECTOR_CHECK_TIMEOUT.
          content:
            application/json:
              example:
                success: false
                code: 2011
                type: GATEWAY_TIMEOUT
                message: >-
                  The Connector has not returned a Tally result before the response timeout. The request
                  remains queued or processing.
                request_id: 18771bcc-5374-4c11-8e43-0b930659de08
                status: queued
              schema:
                $ref: '#/components/schemas/ApiError'
      x-audience: application
  /api/v1/sales-orders:
    get:
      tags:
        - Sales Orders
      summary: Fetch a Sales Order directly from Tally by party ledger and voucher number
      operationId: getSalesOrderFromTally
      description: >-
        No prior import request is needed. The authenticated client's Connector searches the specified Tally
        company for a Sales Order, then exports that voucher by MasterID. The request waits for the existing
        Connector job flow. Returns the structured JSON in vouchers[0].details, including nested allocation
        arrays. Field names are lowercase, .LIST suffixes are removed, attributes use _attributes and scalar
        values remain strings. Without voucher_date, searches 1900-01-01 through 2099-12-31. This is read-only
        in Tally. The temporary job follows transaction request retention. Requires a responsive Connector and
        running Tally. party_ledger and voucher_number remain query aliases. Query values are trimmed
        non-empty strings up to 500 characters. Without voucher_date the date search spans 1900-01-01 through
        2099-12-31. Scalars in details remain strings; lowercase names remove .LIST suffixes and attributes
        appear under _attributes.
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - name: company
          in: query
          required: true
          schema:
            type: string
          example: Demo Company
        - name: ledger_name
          in: query
          required: true
          schema:
            type: string
          example: Demo Customer
        - name: voucher_no
          in: query
          required: true
          schema:
            type: string
          example: SO-1001
        - name: voucher_date
          in: query
          schema:
            type: string
            format: date
          example: '2026-10-28'
      responses:
        '200':
          description: Sales Order fetched from Tally.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: OK
                message: Sales Order retrieved from Tally.
                vouchers:
                  - company: Demo Company
                    ledger_name: Customer Name
                    voucher_no: SO-1001
                    details:
                      vouchernumber: SO-1001
                      partyledgername: Customer Name
                      allinventoryentries: []
                      allledgerentries: []
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          description: No matching Sales Order found in Tally.
        '409':
          description: Multiple Sales Orders match; supply voucher_date.
        '502':
          description: Connector or Tally lookup/export failed.
        '503':
          $ref: '#/components/responses/ConnectorUnavailable'
        '504':
          description: Connector did not return a result before the response timeout.
      x-audience: application
  /api/v1/sales-orders/{requestId}/status:
    get:
      tags:
        - Sales Orders
      summary: Get Sales Order processing status
      operationId: getSalesOrderStatus
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Sales Order request and latest status.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: OK
                message: Sales order request retrieved.
                request_id: 18771bcc-5374-4c11-8e43-0b930659de08
                transaction_type: sales_order
                status: succeeded
                attempt_count: 1
                destination:
                  company: Demo Company
              schema:
                $ref: '#/components/schemas/RequestRecord'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      description: >-
        Reads saved client-scoped status without contacting Tally. Available while Connector/Tally are
        offline. Terminal requests are retained 90 days by default; expired jobs return 404.
      x-audience: application
  /api/v1/sales-orders/{requestId}/connector:
    get:
      tags:
        - Sales Orders
      summary: Fetch queued Sales Order payload (Connector only)
      operationId: getSalesOrderForConnector
      description: >-
        Internal endpoint used by the Connector. Do not call from a CRM. This generic Connector fetch also
        serves ledger_statement and direct voucher lookup jobs. There is no separate ledger Connector HTTP
        route. Lookup jobs expose lookup metadata; Sales Voucher payloads appear under sales_order for
        compatibility.
      security:
        - clientId: []
          connectorApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Stored Sales Order payload for Connector processing.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: OK
                message: Sales order request retrieved.
                request_id: 18771bcc-5374-4c11-8e43-0b930659de08
                destination:
                  company: Demo Company
                transaction_type: sales_order
                status: queued
                sales_order:
                  voucher_type: Sales Order
                  voucher_number: SO-1001
                  order_number: SO-1001
                  date: '2026-10-28'
                  order_due_date: '2026-11-04'
                  party:
                    ledger_name: Demo Customer
                  items:
                    - stock_item: Demo Item
                      quantity: 2
                      unit: Nos
                      rate: 100
                      sales_ledger: Sales
              schema:
                $ref: '#/components/schemas/RequestRecord'
        '401':
          $ref: '#/components/responses/ConnectorUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-audience: connector
  /api/v1/sales:
    get:
      tags:
        - Sales Vouchers
      summary: Fetch a Sales Voucher directly from Tally
      operationId: getSalesVoucherFromTally
      description: >-
        Searches Sales-family vouchers, including custom types such as Sales New, by exact party ledger and
        voucher number. No prior import request required. Returns structured voucher JSON in
        vouchers[0].details. Optional date disambiguates repeated numbers. Requires an updated running
        Connector. Requires a responsive Connector and running Tally. party_ledger and voucher_number remain
        query aliases. Query values are trimmed non-empty strings up to 500 characters. Without voucher_date
        the date search spans 1900-01-01 through 2099-12-31. Scalars in details remain strings; lowercase
        names remove .LIST suffixes and attributes appear under _attributes.
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - name: company
          in: query
          required: true
          schema:
            type: string
          example: Demo Company
        - name: ledger_name
          in: query
          required: true
          schema:
            type: string
          example: Demo Customer
        - name: voucher_no
          in: query
          required: true
          schema:
            type: string
          example: INV-1001
        - name: voucher_date
          in: query
          schema:
            type: string
            format: date
          example: '2026-10-28'
      responses:
        '200':
          description: Sales Voucher export returned in vouchers[0].details.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: OK
                message: Sales Voucher retrieved from Tally.
                vouchers:
                  - company: Demo Company
                    ledger_name: Demo Customer
                    voucher_no: INV-1001
                    details:
                      vouchernumber: INV-1001
                      partyledgername: Demo Customer
                      allinventoryentries: []
                      allledgerentries: []
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
