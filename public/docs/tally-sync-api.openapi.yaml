components:
  securitySchemes:
    clientId:
      type: apiKey
      in: header
      name: X-Client-ID
      description: Client ID issued during registration.
    clientApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: CRM API key sent to the registered email address.
    connectorApiKey:
      type: apiKey
      in: header
      name: X-Connector-Key
      description: Connector key sent to the registered email address.
    consoleSession:
      type: apiKey
      in: cookie
      name: tally_console_session
      description: Session cookie created by POST /api/console/auth/login.
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      description: Request ID returned by the push endpoint.
      schema:
        type: string
        format: uuid
  schemas:
    ClientRegistration:
      type: object
      required:
        - name
        - company_name
        - email
        - tally_license_no
      properties:
        name:
          type: string
          maxLength: 120
        company_name:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        tally_license_no:
          type: string
          maxLength: 100
    SalesOrderPush:
      type: object
      required:
        - destination
        - sales_order
      properties:
        idempotency_key:
          type: string
          description: >-
            Optional retry key, max 200 characters. Reuse only for the same transaction and payload. Use
            module-specific prefixes. A duplicate returns the saved request; payloads are not compared.
          maxLength: 200
        destination:
          $ref: '#/components/schemas/Destination'
        sales_order:
          type: object
          description: >-
            Canonical Sales Order payload. Server validates a non-empty order and allocation due dates; the
            Connector performs remaining Tally business validation. Every item requires a date inherited from
            the order or supplied on the item.
          required:
            - date
            - party
            - items
          properties:
            voucher_type:
              type: string
              example: Sales Order
            order_due_date:
              type: string
              format: date
              description: Required unless every item specifies its own order_due_date; no automatic default.
              example: '2026-11-07'
            voucher_number:
              type: string
            date:
              type: string
              description: YYYY-MM-DD, YYYYMMDD, or DD-MM-YYYY.
              example: '2026-10-12'
            party:
              $ref: '#/components/schemas/PartyLedger'
            items:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Item'
            order_number:
              type: string
              description: Order allocation reference, separate from voucher_number.
              example: SO-1001
            sales_ledger:
              type: string
              description: Optional default sales ledger.
              example: Sales
    SalesVoucherPush:
      type: object
      required:
        - destination
        - sales
      properties:
        idempotency_key:
          type: string
          description: >-
            Optional retry key, max 200 characters. Reuse only for the same transaction and payload. Use
            module-specific prefixes. A duplicate returns the saved request; payloads are not compared.
          maxLength: 200
        destination:
          $ref: '#/components/schemas/Destination'
        sales:
          type: object
          required:
            - date
            - party
            - items
          properties:
            voucher_type:
              type: string
              default: Sales
            voucher_mode:
              type: string
              default: Item Invoice
            voucher_number:
              type: string
            date:
              type: string
              description: YYYY-MM-DD, YYYYMMDD, or DD-MM-YYYY.
              example: '2026-10-12'
            party:
              $ref: '#/components/schemas/PartyLedger'
            items:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Item'
            total_amount:
              type: number
              minimum: 0
              description: Must equal item totals plus any tax/charge ledger amounts.
            sales_ledger:
              type: string
              description: Default sales ledger for all items, otherwise specify it on every item.
              example: Sales
            party_ledger_entry:
              type: object
              description: >-
                Optional explicit customer ledger entry; service normalizes amount to a negative absolute
                value.
              properties:
                ledger:
                  type: string
                amount:
                  type: number
                bill_reference:
                  type: string
                bill_type:
                  type: string
          description: >-
            Canonical item invoice. Every item must specify sales_ledger or inherit sales.sales_ledger. Legacy
            party_ledger and other aliases are accepted.
    ReceiptVoucherPush:
      type: object
      required:
        - destination
        - receipt
      properties:
        idempotency_key:
          type: string
          description: >-
            Optional retry key, max 200 characters. Reuse only for the same transaction and payload. Use
            module-specific prefixes. A duplicate returns the saved request; payloads are not compared.
          maxLength: 200
        destination:
          $ref: '#/components/schemas/Destination'
        receipt:
          type: object
          required:
            - date
            - party
            - payment
            - amount
          properties:
            voucher_type:
              type: string
              default: Receipt
            voucher_number:
              type: string
            date:
              type: string
              description: YYYY-MM-DD, YYYYMMDD, or DD-MM-YYYY.
              example: '2026-10-12'
            party:
              $ref: '#/components/schemas/PartyLedger'
            payment:
              $ref: '#/components/schemas/CashBankLedger'
            amount:
              type: number
              minimum: 0
              exclusiveMinimum: true
            bill_reference:
              type: string
              description: >-
                Existing sales bill reference. Defaults bill_type to Agst Ref when supplied; otherwise service
                uses On Account.
            bill_type:
              type: string
              default: Agst Ref
            custom_fields:
              type: object
              additionalProperties: {}
    Item:
      type: object
      required:
        - stock_item
        - quantity
        - rate
      properties:
        stock_item:
          type: string
          example: Demo Item
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 2
        unit:
          type: string
          example: Nos
        actual_quantity:
          type: number
        actual_unit:
          type: string
        rate:
          type: number
          minimum: 0
          example: 100
        amount:
          type: number
        sales_ledger:
          type: string
          description: >-
            Sales ledger for this item. For Sales Vouchers it is required here or inherited from
            sales.sales_ledger.
        batch:
          type: object
          description: Include for stock items requiring batch/godown allocation; use exact Tally master names.
          properties:
            name:
              type: string
            godown:
              type: string
            manufactured_on:
              type: string
              format: date
            expiry_date:
              type: string
              format: date
        order_due_date:
          type: string
          description: >-
            Order allocation due date. Item value overrides order-level due date. Required for each
            Sales/Purchase Order item unless a valid order-level date is supplied.
          format: date
          example: '2026-10-28'
        purchase_ledger:
          type: string
          description: Purchase ledger for this item; may inherit purchase.purchase_ledger.
          example: Purchase
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
        type:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        error_code:
          type: string
          description: >-
            Optional machine-readable availability failure: CONNECTOR_NOT_CONNECTED, CONNECTOR_NOT_RESPONDING,
            TALLY_NOT_CONNECTED, TALLY_TIMEOUT or CONNECTOR_CHECK_TIMEOUT.
        request_id:
          type: string
          format: uuid
        status:
          type: string
        error:
          type: string
    Destination:
      type: object
      description: >-
      properties:
        company_id:
          type: string
          description: Stable system company ID returned by GET /api/v1/companies. Takes priority over company.
          example: COMP_01JABC123
        company:
          type: string
          description: Legacy exact company name fallback when company_id is omitted.
          example: Demo Company
    PartyLedger:
      type: object
      description: >-
        Identify the customer or supplier by dealer_code when available. Dealer code has priority over
        ledger_name. If dealer_code is omitted, ledger_name is used as the legacy fallback.
      properties:
        dealer_code:
          type: string
          maxLength: 500
          description: Exact Dealer Code value from the Tally ledger TDL field. Takes priority over ledger_name.
          example: DL-10045
        ledger_name:
          type: string
          description: Exact customer or supplier ledger name in the selected Tally company; fallback when dealer_code is not supplied.
          example: Demo Customer
        group:
          type: string
          description: Optional Tally parent group for supported missing-ledger recovery.
    CashBankLedger:
      type: object
      required:
        - ledger_name
      properties:
        ledger_name:
          type: string
          description: Exact Cash or Bank ledger name in Tally.
          example: Cash
        group:
          type: string
          description: Optional Tally parent group.
        type:
          type: string
          enum:
            - cash
            - bank
    ApiEnvelope:
      type: object
      required:
        - success
        - code
        - type
        - message
      description: >-
        JSON envelope. Result properties are at the top level unless the operation explicitly documents data
        or statement.
      properties:
        success:
          type: boolean
        code:
          type: integer
        type:
          type: string
          description: HTTP status label such as OK, CREATED, BAD_REQUEST or GATEWAY_TIMEOUT.
        message:
          type: string
    PushResult:
      type: object
      required:
        - success
        - code
        - type
        - message
        - request_id
        - status
      properties:
        success:
          type: boolean
        code:
          type: integer
        type:
          type: string
          description: HTTP status label such as OK, CREATED, BAD_REQUEST or GATEWAY_TIMEOUT.
        message:
          type: string
        request_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - succeeded
        duplicate:
          type: boolean
        transaction_type:
          type: string
          enum:
            - sales_order
            - sales_voucher
            - receipt_voucher
            - purchase_order
            - purchase_voucher
            - payment_voucher
        voucher_number:
          type: string
          nullable: true
          description: Verified number from Tally; null when no final number was confirmed.
        submitted_voucher_number:
          type: string
          nullable: true
        tally_result:
          type: object
          nullable: true
          additionalProperties: true
          description: Available metadata depends on the Connector/Tally result.
    RequestRecord:
      type: object
      description: >-
        Client-scoped stored request. Additional payload/timestamp/result properties can be present. Sales
        Vouchers are stored under sales_order for Connector compatibility.
      properties:
        success:
          type: boolean
        code:
          type: integer
        type:
          type: string
          description: HTTP status label such as OK, CREATED, BAD_REQUEST or GATEWAY_TIMEOUT.
        message:
          type: string
        request_id:
          type: string
          format: uuid
        transaction_type:
          type: string
        status:
          type: string
          enum:
            - queued
            - processing
            - fetching
            - building_xml
            - pushing
            - succeeded
            - failed
        attempt_count:
          type: integer
        destination:
          $ref: '#/components/schemas/Destination'
        error:
          type: string
        tally_result:
          type: object
          additionalProperties: true
        sales_order:
          type: object
          additionalProperties: true
        receipt:
          type: object
          additionalProperties: true
        purchase_order:
          type: object
          additionalProperties: true
        purchase:
          type: object
          additionalProperties: true
        payment:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    PurchaseOrderPush:
      type: object
      required:
        - destination
        - purchase_order
      properties:
        idempotency_key:
          type: string
          description: >-
            Optional retry key, max 200 characters. Reuse only for the same transaction and payload. Use
            module-specific prefixes. A duplicate returns the saved request; payloads are not compared.
          maxLength: 200
        destination:
          $ref: '#/components/schemas/Destination'
        purchase_order:
          type: object
          required:
            - date
            - party
            - items
            - order_number
          properties:
            voucher_type:
              type: string
              default: Purchase Order
            voucher_number:
              type: string
              description: Submitted voucher reference; final Tally numbering may differ.
            date:
              type: string
              description: Real calendar date. Use YYYY-MM-DD in new integrations.
              format: date
              example: '2026-10-28'
            party:
              $ref: '#/components/schemas/PartyLedger'
            narration:
              type: string
            custom_fields:
              type: object
              description: Technical Tally UDF names with scalar values.
              additionalProperties: {}
            items:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Item'
            total_amount:
              type: number
              minimum: 0
            purchase_ledger:
              type: string
              description: Default purchase ledger; Purchase Voucher needs this or item-level purchase ledgers.
              example: Purchase
            order_number:
              type: string
              description: >-
                Required supplier-facing order reference, separate from voucher_number. purchase_order_number
                is a legacy alias.
              example: ORDER-1001
            order_due_date:
              type: string
              description: Required here unless all items supply their own valid date. No automatic default.
              format: date
              example: '2026-10-28'
    PurchaseVoucherPush:
      type: object
      required:
        - destination
        - purchase
      properties:
        idempotency_key:
          type: string
          description: >-
            Optional retry key, max 200 characters. Reuse only for the same transaction and payload. Use
            module-specific prefixes. A duplicate returns the saved request; payloads are not compared.
          maxLength: 200
        destination:
          $ref: '#/components/schemas/Destination'
        purchase:
          type: object
          required:
            - date
            - party
            - items
          properties:
            voucher_type:
              type: string
              default: Purchase
            voucher_number:
              type: string
              description: Submitted voucher reference; final Tally numbering may differ.
            date:
              type: string
              description: Real calendar date. Use YYYY-MM-DD in new integrations.
              format: date
              example: '2026-10-28'
            party:
              $ref: '#/components/schemas/PartyLedger'
            narration:
              type: string
            custom_fields:
              type: object
              description: Technical Tally UDF names with scalar values.
              additionalProperties: {}
            items:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Item'
            total_amount:
              type: number
              minimum: 0
            purchase_ledger:
              type: string
              description: Default purchase ledger; Purchase Voucher needs this or item-level purchase ledgers.
              example: Purchase
    PaymentVoucherPush:
      type: object
      required:
        - destination
        - payment
      properties:
        idempotency_key:
          type: string
          description: >-
            Optional retry key, max 200 characters. Reuse only for the same transaction and payload. Use
            module-specific prefixes. A duplicate returns the saved request; payloads are not compared.
          maxLength: 200
        destination:
          $ref: '#/components/schemas/Destination'
        payment:
          type: object
          required:
            - date
            - party
            - payment
            - amount
          properties:
            voucher_type:
              type: string
              default: Payment
            voucher_number:
              type: string
              description: Submitted voucher reference; final Tally numbering may differ.
            date:
              type: string
              description: Real calendar date. Use YYYY-MM-DD in new integrations.
              format: date
              example: '2026-10-28'
            party:
              $ref: '#/components/schemas/PartyLedger'
            narration:
              type: string
            custom_fields:
              type: object
              description: Technical Tally UDF names with scalar values.
              additionalProperties: {}
            payment:
              $ref: '#/components/schemas/CashBankLedger'
            amount:
              type: number
              minimum: 0
              exclusiveMinimum: true
            bill_reference:
              type: string
            bill_type:
              type: string
    Balance:
      type: object
      properties:
        amount:
          type: number
          minimum: 0
        type:
          type: string
          nullable: true
          enum:
            - Dr
            - Cr
            - null
    LedgerEntry:
      type: object
      description: Normalized base-currency movement. Optional inventory/bill details come from the synced cache.
      properties:
        date:
          type: string
          format: date
        voucher_no:
          type: string
        voucher_type:
          type: string
        master_id:
          type: string
        narration:
          type: string
        particulars:
          type: array
          items:
            type: string
        debit:
          type: number
        credit:
          type: number
        balance:
          $ref: '#/components/schemas/Balance'
        inventory_entries:
          type: array
          items:
            type: object
            additionalProperties: true
        bill_allocations:
          type: array
          items:
            type: object
            additionalProperties: true
    LedgerStatement:
      type: object
      properties:
        company:
          type: string
        ledger_name:
          type: string
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date
        opening_balance:
          $ref: '#/components/schemas/Balance'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        total_debit:
          type: number
        total_credit:
          type: number
        closing_balance:
          $ref: '#/components/schemas/Balance'
        source:
          type: string
          example: local_sqlite
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        sync_status:
          type: string
        is_stale:
          type: boolean
        company_details:
          type: object
          additionalProperties: true
        details_available:
          type: boolean
  responses:
    ValidationError:
      description: Invalid input. errors includes field paths, including nested item paths.
      content:
        application/json:
          example:
            success: false
            code: 2001
            type: BAD_REQUEST
            message: Invalid voucher request.
            errors:
              - field: sales.items[0].sales_ledger
                message: Sales ledger is required on the item or sales voucher.
          schema:
            $ref: '#/components/schemas/ApiError'
    ClientUnauthorized:
      description: Missing or invalid client ID/API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 2005
            type: UNAUTHORIZED
            message: X-Client-ID and X-API-Key headers are required.
    ConnectorUnauthorized:
      description: Missing or invalid Connector credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 2005
            type: UNAUTHORIZED
            message: Connector credentials are required.
    ConsoleUnauthorized:
      description: Missing, expired, or invalid Admin Console session cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 2401
            type: UNAUTHORIZED
            message: Admin Console login required.
    NotFound:
      description: Request ID was not found for the authenticated client.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 2004
            type: NOT_FOUND
            message: Sales order request not found.
    ServiceUnavailable:
      description: Required database or credential email service is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 2000
            type: SERVICE_UNAVAILABLE
            message: Service is temporarily unavailable.
    ConnectorUnavailable:
      description: Connector disconnected or unresponsive. New live work is not queued until preflight succeeds.
      content:
        application/json:
          example:
            success: false
            code: 2013
            type: SERVICE_UNAVAILABLE
            message: Connector is not connected. Start the Connector and connect it to the Server.
            error_code: CONNECTOR_NOT_CONNECTED
          schema:
            $ref: '#/components/schemas/ApiError'
    TallyUnavailable:
      description: Connector online but Tally unreachable.
      content:
        application/json:
          example:
            success: false
            code: 2014
            type: SERVICE_UNAVAILABLE
            message: Tally is not connected.
            error_code: TALLY_NOT_CONNECTED
          schema:
            $ref: '#/components/schemas/ApiError'
    JobTimeout:
      description: >-
        Connector has not completed the job within the configured wait. Work may still finish; read status
        using request_id before retrying.
      content:
        application/json:
          example:
            success: false
            code: 2011
            type: GATEWAY_TIMEOUT
            message: >-
              The Connector has not returned a Tally result before the response timeout. The request remains
              queued or processing.
            request_id: 18771bcc-5374-4c11-8e43-0b930659de08
            status: queued
          schema:
            $ref: '#/components/schemas/ApiError'
    TallyRejected:
      description: Tally rejected this import. Correct the business data after inspecting error.
      content:
        application/json:
          example:
            success: false
            code: 2012
            type: BAD_GATEWAY
            message: Tally did not accept the voucher.
            request_id: 18771bcc-5374-4c11-8e43-0b930659de08
            status: failed
            error: Tally returned an import error.
          schema:
            $ref: '#/components/schemas/ApiError'
    AvailabilityTimeout:
      description: Connection preflight timed out. error_code is TALLY_TIMEOUT or CONNECTOR_CHECK_TIMEOUT.
      content:
        application/json:
          example:
            success: false
            code: 2015
            type: GATEWAY_TIMEOUT
            message: Tally did not respond before the connection check timed out.
            error_code: TALLY_TIMEOUT
          schema:
            $ref: '#/components/schemas/ApiError'
    PdfPending:
      description: Export queued or in progress. Poll the same URL; these are JSON job details, not PDF bytes.
      content:
        application/json:
          example:
            success: true
            code: 1002
            type: ACCEPTED
            message: Sales Voucher PDF export requested. Poll this endpoint again to download it when ready.
            request_id: 18771bcc-5374-4c11-8e43-0b930659de08
            pdf_status: queued
            connector_notified: true
