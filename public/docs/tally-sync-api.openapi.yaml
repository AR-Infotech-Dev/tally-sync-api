      parameters:
        - name: ledger_name
          in: query
          required: true
          description: Exact party ledger name. party_ledger is a compatibility alias.
          schema:
            type: string
            minLength: 1
        - name: company
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: voucher_no
          in: query
          required: true
          description: Exact Tally voucher number. voucher_number is a compatibility alias.
          schema:
            type: string
            minLength: 1
        - name: voucher_date
          in: query
          description: Optional date to disambiguate repeated voucher numbers across years.
          schema:
            type: string
            format: date
        - name: retry
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: PDF file is ready.
          content:
