        retention windows. Ready cached PDFs remain downloadable with valid client authentication while
        Connector/Tally are offline. New/uncached exports require Connector and Tally. Use retry=true after
        fixing a failed export. Default PDF retention is 90 days; request-ID PDFs expire no later than the
        source request.
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: retry
          in: query
          required: false
          description: Set true to start a new export after a prior failed attempt.
          schema:
            type: boolean
      responses:
        '200':
          description: PDF file is ready.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '202':
          $ref: '#/components/responses/PdfPending'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
