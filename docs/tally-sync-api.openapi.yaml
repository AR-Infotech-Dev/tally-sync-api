openapi: 3.0.3
info:
  title: Flowups Tally Sync API
  version: 1.0.0
  description: >-
    API for registering a CRM client, queuing Sales Orders, Sales Vouchers, and
    Receipt Vouchers for a registered Tally Connector, and checking request status.
    CRM requests are accepted asynchronously; HTTP 202 means queued, not yet
    written to Tally. Use the returned request_id to check the final status.
servers:
  - url: http://localhost:3000
    description: Local Server
  - url: https://sync.flowups.in
    description: Production Server
tags:
  - name: Health
  - name: Client Registration
  - name: Sales Orders
  - name: Sales Vouchers
  - name: Receipt Vouchers
  - name: Admin Console
paths:
  /api/v1/clients/activate-connector:
    post:
      tags: [Client Registration]
      summary: Exchange a one-time emailed activation code for Connector credentials
      operationId: activateConnector
      security: []
      description: >-
        Code expires 24 hours after registration and is consumed atomically once.
        Returns Connector credentials only; never returns the application API key.
        Use HTTPS remotely. On failure or a lost response, use manual Connector
        credentials from the registration email. Limited to 10 attempts per 15 minutes.
        Existing application authentication remains X-Client-ID plus X-API-Key;
        the API key is the secret and no separate API Secret is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activation_code]
              properties:
                activation_code:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '200':
          description: Connector credentials; response has Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  code: {type: integer}
                  type: {type: string}
                  message: {type: string}
                  client_id: {type: string}
                  connector_id: {type: string}
                  connector_key: {type: string, description: Secret for Connector use only}
        '400':
          description: Missing or malformed activation code.
        '401':
          description: Invalid, expired or previously used activation code.
        '429':
          description: Too many activation attempts.
  /api/v1/ledgers/statement/pdf:
    post:
      tags: [Ledger Statements]
      summary: Generate a PDF ledger statement from the local synced snapshot
      operationId: getLedgerStatementPdf
      security:
        - clientId: []
          clientApiKey: []
      description: >-
        Uses the same company, ledger_name, from_date and to_date body as the JSON
        statement endpoint. Returns a downloadable PDF with repeated headers, period
        balances, transactions and freshness metadata. No extra Tally export occurs.
        Errors remain JSON. PDF bytes are generated in memory and are not persisted.
      requestBody:
        $ref: '#/paths/~1api~1v1~1ledgers~1statement/post/requestBody'
      responses:
        '200':
          description: Ledger statement PDF ready for preview or saving.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="statement-Anjan_Ambare-2026-10-01-2026-10-31.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          description: Ledger or statement job not found.
        '503':
          description: Initial local sync has not completed.
        '504':
          description: Connector response timed out.
  /api/v1/ledgers/statement:
    post:
      tags: [Ledger Statements]
      summary: Read a normalized ledger statement from the Connector SQLite cache
      operationId: getLedgerStatement
      parameters:
        - name: format
          in: query
          description: Set pdf for PDF bytes; omit for the existing JSON response.
          schema:
            type: string
            enum: [json, pdf]
      description: >-
        Date range is inclusive. Company defaults to Connector settings if omitted.
        Returns normalized base-currency entries, debit/credit totals, opening and
        closing balances. Opening includes posted movements before from_date.
        Connector performs initial and three-minute background Tally syncs.
        This API never queries Tally directly. Requires a running Connector and
        a completed local snapshot; returns 503 while the cache is uninitialized.
        Tally can be offline after initial sync; stale data is explicitly marked.
        Uses the existing asynchronous job flow while the HTTP request waits.
      security:
        - clientId: []
          clientApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledger_name, from_date, to_date]
              properties:
                company:
                  type: string
                ledger_name:
                  type: string
                from_date:
                  type: string
                  format: date
                to_date:
                  type: string
                  format: date
            example:
              company: Sai Enterprises
              ledger_name: Anjan Ambare
              from_date: '2026-10-01'
              to_date: '2026-10-31'
      responses:
        '200':
          description: Normalized statement; no activity returns an empty entries array.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              example:
                success: true
                code: 1000
                type: OK
                message: Ledger statement retrieved from local synced database.
                data:
                  company: Sai Enterprises
                  ledger_name: Anjan Ambare
                  from_date: '2026-10-01'
                  to_date: '2026-10-31'
                  opening_balance: {amount: 0, type: null}
                  entries:
                    - date: '2026-10-31'
                      voucher_no: '44'
                      voucher_type: Sales New
                      master_id: '123'
                      narration: ''
                      particulars: [Sales]
                      debit: 250
                      credit: 0
                      balance: {amount: 250, type: Dr}
                  total_debit: 250
                  total_credit: 0
                  closing_balance: {amount: 250, type: Dr}
                  source: local_sqlite
                  last_synced_at: '2026-10-23T10:00:00.000Z'
                  sync_status: ready
                  is_stale: false
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          description: Ledger not found in the selected company.
        '502':
          description: Connector or local statement read failed.
        '503':
          description: Company local cache is not initialized; wait for the first successful sync.
        '504':
          description: Connector response timed out; request_id can be used at the status endpoint.
  /api/v1/ledgers/{requestId}/status:
    get:
      tags: [Ledger Statements]
      operationId: getLedgerStatementStatus
      summary: Read a ledger statement job status and completed result
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Job status with statement if completed or error if failed.
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      tags: [Health]
      summary: Check Server health
      operationId: getHealth
      responses:
        '200':
          description: Server is running.
          content:
            application/json:
              example:
                status: ok
                app: Flowups - Tally Sync API
                legacyRoot: /
                migratedControllers: [login]
  /api/v1/clients/register:
    post:
      tags: [Client Registration]
      summary: Register a CRM client and Tally Connector
      operationId: registerClient
      description: >-
        Registers a client using its Tally license number. The API key and
        Connector credentials are emailed to the submitted address; they are
        not returned in the response. Registration is rate-limited to five
        requests per hour per source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistration'
            example:
              name: Aniket Sonawane
              company_name: Sai Enterprises
              email: aniket@example.com
              tally_license_no: '123456789012345'
      responses:
        '201':
          description: Client registered; credentials emailed.
          content:
            application/json:
              example:
                success: true
                code: 1001
                type: CREATED
                message: Client registered. Credentials were sent to the registered email address.
                client_id: CLIENT_0123456789ABCDEF
                connector_id: CONNECTOR_0123456789ABCDEF
                email: aniket@example.com
                credentials_emailed: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Tally license number is already registered.
          content:
            application/json:
              example:
                success: false
                code: 2000
                type: CONFLICT
                message: This Tally license number is already registered.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/sales-orders/push:
    post:
      tags: [Sales Orders]
      summary: Queue a Sales Order for Tally
      operationId: pushSalesOrder
      description: >-
        Queues a Sales Order, stores the JSON payload, and notifies the
        registered Connector over Socket.IO. A 202 response means accepted for
        processing; poll the CRM status endpoint for the final result.
        Reuse the same idempotency_key only when retrying the same transaction.
      security:
        - clientId: []
          clientApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderPush'
            example:
              idempotency_key: CRM-SO-2026-0001
              destination:
                company: Sai Enterprises
              sales_order:
                voucher_type: Sales Order
                voucher_number: SO-1001
                date: '2026-10-12'
                party:
                  ledger_name: Anjan Ambare
                items:
                  - stock_item: COTTON (KAPAS) NONBTGOLD-30 475 gm
                    quantity: 1
                    unit: Nos
                    rate: 250
                    amount: 250
      responses:
        '202':
          description: Sales Order accepted or recognized as an idempotent duplicate.
          content:
            application/json:
              example:
                success: true
                code: 1001
                type: ACCEPTED
                message: Sales order accepted for processing.
                request_id: 18771bcc-5374-4c11-8e43-0b930659de08
                status: queued
                duplicate: false
                connector_notified: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/sales-orders:
    get:
      tags: [Sales Orders]
      summary: Fetch a Sales Order directly from Tally by party ledger and voucher number
      operationId: getSalesOrderFromTally
      description: >-
        No prior import request is needed. The authenticated client's Connector searches
        the specified Tally company for a Sales Order, then exports that voucher by
        MasterID. The request waits for the existing Connector job flow. Returns the
        structured JSON in vouchers[0].details, including nested allocation arrays. Field names are lowercase, .LIST suffixes are removed, attributes use _attributes and scalar values remain strings.
        Without voucher_date, searches 1900-01-01 through 2099-12-31. This is read-only
        in Tally. The temporary job follows transaction request retention.
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - name: company
          in: query
          required: true
          schema:
            type: string
        - name: ledger_name
          in: query
          required: true
          schema:
            type: string
        - name: voucher_no
          in: query
          required: true
          schema:
            type: string
        - name: voucher_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Sales Order fetched from Tally.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: SUCCESS
                message: Sales Order retrieved from Tally.
                vouchers:
                  - company: Sai Enterprises
                    ledger_name: Customer Name
                    voucher_no: SO-1001
                    details:
                      vouchernumber: SO-1001
                      partyledgername: Customer Name
                      allinventoryentries: []
                      allledgerentries: []
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          description: No matching Sales Order found in Tally.
        '409':
          description: Multiple Sales Orders match; supply voucher_date.
        '502':
          description: Connector or Tally lookup/export failed.
        '504':
          description: Connector did not return a result before the response timeout.
  /api/v1/sales-orders/{requestId}/status:
    get:
      tags: [Sales Orders]
      summary: Get Sales Order processing status
      operationId: getSalesOrderStatus
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Sales Order request and latest status.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: SUCCESS
                message: Sales order request retrieved.
                request_id: 18771bcc-5374-4c11-8e43-0b930659de08
                transaction_type: sales_order
                status: succeeded
                attempt_count: 1
                destination:
                  company: Sai Enterprises
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sales-orders/{requestId}/connector:
    get:
      tags: [Sales Orders]
      summary: Fetch queued Sales Order payload (Connector only)
      operationId: getSalesOrderForConnector
      description: Internal endpoint used by the Connector. Do not call from a CRM.
      security:
        - clientId: []
          connectorApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Stored Sales Order payload for Connector processing.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: SUCCESS
                message: Sales order request retrieved.
                request_id: 18771bcc-5374-4c11-8e43-0b930659de08
                destination:
                  company: Sai Enterprises
                sales_order:
                  voucher_type: Sales Order
                  voucher_number: SO-1001
                  date: '2026-10-12'
                  party:
                    ledger_name: Anjan Ambare
                  items: []
        '401':
          $ref: '#/components/responses/ConnectorUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sales:
    get:
      tags: [Sales Vouchers]
      summary: Fetch a Sales Voucher directly from Tally
      operationId: getSalesVoucherFromTally
      description: >-
        Searches Sales-family vouchers, including custom types such as Sales New,
        by exact party ledger and voucher number. No prior import request required.
        Returns structured voucher JSON in vouchers[0].details. Optional date
        disambiguates repeated numbers. Requires an updated running Connector.
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - name: company
          in: query
          required: true
          schema:
            type: string
        - name: ledger_name
          in: query
          required: true
          schema:
            type: string
        - name: voucher_no
          in: query
          required: true
          schema:
            type: string
        - name: voucher_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Sales Voucher export returned in vouchers[0].details.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          description: No matching Sales Voucher in Tally.
        '409':
          description: Multiple matches; supply voucher_date.
        '502':
          description: Tally lookup or export failed.
        '504':
          description: Connector result timed out.
  /api/v1/sales/push:
    post:
      tags: [Sales Vouchers]
      summary: Queue a standalone Sales Voucher for Tally
      operationId: pushSalesVoucher
      description: >-
        Creates a standalone Sales Voucher / invoice; it does not link to an
        existing Sales Order. The Server stores the payload and notifies the
        registered Connector. Ensure ledger totals balance. For stock items
        configured for batch/godown tracking, include the actual batch and
        godown values from Tally. A 202 response means queued, not saved in Tally.
      security:
        - clientId: []
          clientApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesVoucherPush'
            example:
              idempotency_key: CRM-SALES-2026-0001
              destination:
                company: Sai Enterprises
              sales:
                voucher_type: Sales
                voucher_mode: Item Invoice
                voucher_number: '25'
                date: '2026-10-12'
                party:
                  ledger_name: Anjan Ambare
                items:
                  - stock_item: COTTON (KAPAS) NONBTGOLD-30 475 gm
                    quantity: 1
                    unit: Nos
                    rate: 250
                    amount: 250
                    sales_ledger: Sales
                    batch:
                      name: TL-LOT2026-22
                      godown: Main Location
                      manufactured_on: '2026-05-18'
                      expiry_date: '2027-01-13'
                total_amount: 250
      responses:
        '202':
          description: Sales Voucher accepted or recognized as an idempotent duplicate.
          content:
            application/json:
              example:
                success: true
                code: 1001
                type: ACCEPTED
                message: Sales Voucher accepted for processing.
                request_id: 49cfa49b-7331-4d12-84c1-bf3274efae70
                status: queued
                duplicate: false
                connector_notified: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/sales/{requestId}:
    get:
      tags: [Sales Vouchers]
      summary: Get Sales Voucher processing status
      operationId: getSalesVoucherStatus
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Sales Voucher request and latest status.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: SUCCESS
                message: Sales Voucher request retrieved.
                request_id: 49cfa49b-7331-4d12-84c1-bf3274efae70
                transaction_type: sales_voucher
                status: succeeded
                attempt_count: 1
                destination:
                  company: Sai Enterprises
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sales/{requestId}/connector:
    get:
      tags: [Sales Vouchers]
      summary: Fetch queued Sales Voucher payload (Connector only)
      operationId: getSalesVoucherForConnector
      description: Internal endpoint used by the Connector. Do not call from a CRM.
      security:
        - clientId: []
          connectorApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Stored Sales Voucher payload for Connector processing.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: SUCCESS
                message: Sales Voucher request retrieved.
                request_id: 49cfa49b-7331-4d12-84c1-bf3274efae70
                destination:
                  company: Sai Enterprises
                transaction_type: sales_voucher
                sales_order:
                  voucher_type: Sales
                  is_invoice: true
                  voucher_number: '25'
                  date: '2026-10-12'
                  items: []
                  total_amount: 250
        '401':
          $ref: '#/components/responses/ConnectorUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sales/pdf:
    get:
      tags: [Sales Vouchers]
      summary: Request or download a Sales Voucher PDF directly from Tally
      operationId: requestSalesVoucherPdfByNumber
      description: >-
        Connector searches Tally by company, party ledger and voucher number without
        a prior import request. Poll the same URL after 202. Zero or multiple Tally
        matches fail the export (424); supply voucher_date to disambiguate. Cached
        PDFs and temporary jobs have independent retention. Deleted cache is recreated.
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - name: ledger_name
          in: query
          required: true
          description: Exact party ledger name. party_ledger is a compatibility alias.
          schema:
            type: string
            minLength: 1
        - name: company
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: voucher_no
          in: query
          required: true
          description: Exact Tally voucher number. voucher_number is a compatibility alias.
          schema:
            type: string
            minLength: 1
        - name: voucher_date
          in: query
          description: Optional date to disambiguate repeated voucher numbers across years.
          schema:
            type: string
            format: date
        - name: retry
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: PDF file is ready.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '202':
          description: Export queued or in progress; poll again.
        '400':
          description: Invalid or missing company, ledger_name, voucher_no or voucher_date.
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '424':
          description: Tally lookup or export failed; correct values or supply voucher_date then retry.
  /api/v1/sales/{requestId}/pdf:
    get:
      tags: [Sales Vouchers]
      summary: Request or download a Sales Voucher PDF
      operationId: requestSalesVoucherPdf
      description: >-
        CRM calls this endpoint only when a PDF is needed. The first call
        requests an export from the registered Connector and returns 202.
        Poll the same endpoint; once the Connector uploads the PDF, the response
        is application/pdf. Sales Voucher request documents and PDF artifacts
        have separate MongoDB retention windows.
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: retry
          in: query
          required: false
          description: Set true to start a new export after a prior failed attempt.
          schema:
            type: boolean
      responses:
        '200':
          description: PDF file is ready.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '202':
          description: Export queued or in progress; retry this GET to download when ready.
          content:
            application/json:
              example:
                success: true
                code: 1002
                type: ACCEPTED
                message: Sales Voucher PDF export requested. Poll this endpoint again to download it when ready.
                request_id: 18771bcc-5374-4c11-8e43-0b930659de08
                pdf_status: queued
                connector_notified: true
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Sales Voucher has not succeeded in Tally yet.
        '424':
          description: Previous PDF export failed; retry=true starts a new export attempt.
  /api/v1/sales/{requestId}/pdf/connector:
    post:
      tags: [Sales Vouchers]
      summary: Upload exported PDF (Connector only)
      operationId: uploadSalesVoucherPdf
      description: Connector uploads the PDF bytes as application/pdf using its connector credentials.
      security:
        - clientId: []
          connectorApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: X-PDF-Filename
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: PDF stored for CRM download.
        '400':
          description: Invalid PDF or file is larger than 15 MB.
        '401':
          $ref: '#/components/responses/ConnectorUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sales/{requestId}/pdf/connector/status:
    post:
      tags: [Sales Vouchers]
      summary: Update PDF export status (Connector only)
      operationId: updateSalesVoucherPdfStatus
      security:
        - clientId: []
          connectorApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [generating, failed]
                error:
                  type: string
      responses:
        '200':
          description: PDF export status updated.
        '401':
          $ref: '#/components/responses/ConnectorUnauthorized'
  /api/v1/receipts/push:
    post:
      tags: [Receipt Vouchers]
      summary: Queue a Receipt Voucher for Tally
      operationId: pushReceiptVoucher
      description: >-
        Queues a receipt/payment received from a customer. The Connector creates
        an accounting Receipt Voucher with the Cash/Bank ledger debited and the
        customer ledger credited. Set bill_reference to allocate the receipt
        against an existing Sales bill; without it, the receipt is recorded On
        Account. If Tally reports a missing ledger that has a known role in the
        payload, the background Connector creates a basic ledger under its
        standard Tally group and retries the voucher. A 202 response means
        queued, not yet saved in Tally.
      security:
        - clientId: []
          clientApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptVoucherPush'
            example:
              idempotency_key: CRM-RECEIPT-2026-0001
              destination:
                company: Sai Enterprises
              receipt:
                voucher_type: Receipt
                voucher_number: '12'
                date: '2026-10-12'
                party:
                  ledger_name: Anjan Ambare
                payment:
                  ledger_name: HDFC Bank
                  group: Bank Accounts
                amount: 250
                bill_reference: '25'
                bill_type: Agst Ref
      responses:
        '202':
          description: Receipt Voucher accepted or recognized as an idempotent duplicate.
          content:
            application/json:
              example:
                success: true
                code: 1001
                type: ACCEPTED
                message: Receipt Voucher accepted for processing.
                request_id: f5cab14e-f031-4fb8-aeb3-5a17edc1d49f
                status: queued
                duplicate: false
                connector_notified: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/receipts/{requestId}:
    get:
      tags: [Receipt Vouchers]
      summary: Get Receipt Voucher processing status
      operationId: getReceiptVoucherStatus
      security:
        - clientId: []
          clientApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Receipt Voucher request and latest status.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: SUCCESS
                message: Receipt Voucher request retrieved.
                request_id: f5cab14e-f031-4fb8-aeb3-5a17edc1d49f
                transaction_type: receipt_voucher
                status: succeeded
                attempt_count: 1
                destination:
                  company: Sai Enterprises
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/receipts/{requestId}/connector:
    get:
      tags: [Receipt Vouchers]
      summary: Fetch Receipt Voucher payload (Connector only)
      operationId: getReceiptVoucherForConnector
      description: Internal endpoint used by the Connector. Do not call from a CRM.
      security:
        - clientId: []
          connectorApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Stored Receipt Voucher payload for Connector processing.
          content:
            application/json:
              example:
                success: true
                code: 1000
                type: SUCCESS
                message: Receipt Voucher request retrieved.
                request_id: f5cab14e-f031-4fb8-aeb3-5a17edc1d49f
                transaction_type: receipt_voucher
                destination:
                  company: Sai Enterprises
                receipt:
                  voucher_type: Receipt
                  voucher_number: '12'
                  date: '2026-10-12'
                  party:
                    ledger_name: Anjan Ambare
                  payment:
                    ledger_name: HDFC Bank
                  amount: 250
                  bill_reference: '25'
                  bill_type: Agst Ref
        '401':
          $ref: '#/components/responses/ConnectorUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/console/auth/status:
    get:
      tags: [Admin Console]
      summary: Check whether Admin Console login is configured
      operationId: getConsoleAuthStatus
      responses:
        '200':
          description: Console credential configuration status.
          content:
            application/json:
              example:
                configured: true
  /api/console/auth/login:
    post:
      tags: [Admin Console]
      summary: Sign in to the Admin Console
      operationId: loginToConsole
      description: >-
        Uses the Server's CONSOLE_USERNAME and CONSOLE_PASSWORD settings.
        Successful login sets an HTTP-only session cookie valid for eight hours.
        Do not store production credentials in a shared collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
            example:
              username: '{{console_username}}'
              password: '{{console_password}}'
      responses:
        '200':
          description: Login successful; response sets the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HTTP-only tally_console_session cookie.
          content:
            application/json:
              example:
                success: true
                code: 1400
                type: SUCCESS
                message: Admin Console login successful.
                authenticated: true
                username: '{{console_username}}'
        '401':
          description: Incorrect Console username or password.
          content:
            application/json:
              example:
                success: false
                code: 2401
                type: UNAUTHORIZED
                message: Username or password is incorrect.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/console/auth/logout:
    post:
      tags: [Admin Console]
      summary: Sign out of the Admin Console
      operationId: logoutFromConsole
      description: Clears the Console session cookie.
      responses:
        '200':
          description: Console session ended.
          content:
            application/json:
              example:
                success: true
                code: 1401
                type: SUCCESS
                message: Admin Console session ended.
                authenticated: false
  /api/console/auth/me:
    get:
      tags: [Admin Console]
      summary: Get current Admin Console session
      operationId: getConsoleSession
      security:
        - consoleSession: []
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              example:
                success: true
                code: 1400
                type: SUCCESS
                message: Admin Console session is active.
                authenticated: true
                username: '{{console_username}}'
        '401':
          $ref: '#/components/responses/ConsoleUnauthorized'
  /api/console/snapshot:
    get:
      tags: [Admin Console]
      summary: Get Server Console dashboard snapshot
      operationId: getConsoleSnapshot
      security:
        - consoleSession: []
      responses:
        '200':
          description: Runtime, MongoDB, connector, queued job, and recent log snapshot.
          content:
            application/json:
              example:
                success: true
                code: 1400
                type: SUCCESS
                message: Admin Console snapshot loaded.
                capturedAt: '2026-10-12T06:00:00.000Z'
                server:
                  status: online
                  environment: production
                  nodeVersion: v24.15.0
                  uptimeSeconds: 3600
                  startedAt: '2026-10-12T05:00:00.000Z'
                socket:
                  status: online
                  registeredCount: 1
                  connectors: []
                database:
                  status: connected
                  clients:
                    total: 1
                    active: 1
                  salesOrders:
                    total: 1
                    byStatus:
                      queued: 0
                      processing: 0
                      fetching: 0
                      building_xml: 0
                      pushing: 0
                      succeeded: 1
                      failed: 0
                jobs: []
                logs: []
        '401':
          $ref: '#/components/responses/ConsoleUnauthorized'
components:
  securitySchemes:
    clientId:
      type: apiKey
      in: header
      name: X-Client-ID
      description: Client ID issued during registration.
    clientApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: CRM API key sent to the registered email address.
    connectorApiKey:
      type: apiKey
      in: header
      name: X-Connector-Key
      description: Connector key sent to the registered email address.
    consoleSession:
      type: apiKey
      in: cookie
      name: tally_console_session
      description: Session cookie created by POST /api/console/auth/login.
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      description: Request ID returned by the push endpoint.
      schema:
        type: string
        format: uuid
  schemas:
    ClientRegistration:
      type: object
      required: [name, company_name, email, tally_license_no]
      properties:
        name:
          type: string
          maxLength: 120
        company_name:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        tally_license_no:
          type: string
          maxLength: 100
    SalesOrderPush:
      type: object
      required: [destination, sales_order]
      properties:
        idempotency_key:
          type: string
          maxLength: 200
        destination:
          type: object
          required: [company]
          properties:
            company:
              type: string
        sales_order:
          type: object
          description: Sales Order payload; custom Tally fields may be supplied as needed.
          required: [date, party, items]
          properties:
            voucher_type:
              type: string
              example: Sales Order
            voucher_number:
              type: string
            date:
              type: string
              description: YYYY-MM-DD, YYYYMMDD, or DD-MM-YYYY.
              example: '2026-10-12'
            party:
              type: object
              properties:
                ledger_name:
                  type: string
            items:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Item'
    SalesVoucherPush:
      type: object
      required: [destination, sales]
      properties:
        idempotency_key:
          type: string
          maxLength: 200
        destination:
          type: object
          required: [company]
          properties:
            company:
              type: string
        sales:
          type: object
          required: [date, party, items]
          properties:
            voucher_type:
              type: string
              default: Sales
            voucher_mode:
              type: string
              default: Item Invoice
            voucher_number:
              type: string
            date:
              type: string
              description: YYYY-MM-DD, YYYYMMDD, or DD-MM-YYYY.
              example: '2026-10-12'
            party:
              type: object
              properties:
                ledger_name:
                  type: string
            items:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Item'
            total_amount:
              type: number
              minimum: 0
              description: Must equal item totals plus any tax/charge ledger amounts.
    ReceiptVoucherPush:
      type: object
      required: [destination, receipt]
      properties:
        idempotency_key:
          type: string
          maxLength: 200
          description: Reuse only when retrying the same receipt transaction.
        destination:
          type: object
          required: [company]
          properties:
            company:
              type: string
        receipt:
          type: object
          required: [date, party, payment, amount]
          properties:
            voucher_type:
              type: string
              default: Receipt
            voucher_number:
              type: string
            date:
              type: string
              description: YYYY-MM-DD, YYYYMMDD, or DD-MM-YYYY.
              example: '2026-10-12'
            party:
              type: object
              required: [ledger_name]
              properties:
                ledger_name:
                  type: string
                group:
                  type: string
                  description: Optional Tally parent group; defaults to Sundry Debtors for a missing customer ledger.
            payment:
              type: object
              required: [ledger_name]
              properties:
                ledger_name:
                  type: string
                  description: Cash or Bank ledger name configured in Tally.
                group:
                  type: string
                  description: Optional Tally parent group; defaults to Cash-in-Hand for a Cash type/name, otherwise Bank Accounts.
                type:
                  type: string
                  enum: [cash, bank]
            amount:
              type: number
              exclusiveMinimum: 0
            bill_reference:
              type: string
              description: Existing Sales bill reference; when provided, bill_type defaults to Agst Ref.
            bill_type:
              type: string
              default: Agst Ref
            custom_fields:
              type: object
              additionalProperties:
                type: string
    Item:
      type: object
      required: [stock_item, quantity, rate]
      properties:
        stock_item:
          type: string
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
        actual_quantity:
          type: number
        actual_unit:
          type: string
        rate:
          type: number
          minimum: 0
        amount:
          type: number
        sales_ledger:
          type: string
        batch:
          type: object
          description: Include for stock items requiring batch/godown allocation; use exact Tally master names.
          properties:
            name:
              type: string
            godown:
              type: string
            manufactured_on:
              type: string
              format: date
            expiry_date:
              type: string
              format: date
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
        type:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 2001
            type: BAD_REQUEST
            message: Invalid request.
            errors:
              - field: sales.items
                message: At least one sales item is required.
    ClientUnauthorized:
      description: Missing or invalid client ID/API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 2005
            type: UNAUTHORIZED
            message: X-Client-ID and X-API-Key headers are required.
    ConnectorUnauthorized:
      description: Missing or invalid Connector credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 2005
            type: UNAUTHORIZED
            message: Connector credentials are required.
    ConsoleUnauthorized:
      description: Missing, expired, or invalid Admin Console session cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 2401
            type: UNAUTHORIZED
            message: Admin Console login required.
    NotFound:
      description: Request ID was not found for the authenticated client.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 2004
            type: NOT_FOUND
            message: Sales order request not found.
    ServiceUnavailable:
      description: Required database or credential email service is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 2000
            type: SERVICE_UNAVAILABLE
            message: Service is temporarily unavailable.
